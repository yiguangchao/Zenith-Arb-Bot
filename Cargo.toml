[package]
name = "zenith_bot"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
eyre = "0.6"
dotenv = "0.15"
alloy = { version = "0.1", features = ["full", "node-bindings"] } 
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures = "0.3"